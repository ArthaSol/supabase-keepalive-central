              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d "{\"last_ping\": \"${{ steps.time.outputs.timestamp }}\"}" \
              "https://audmwkalkloomrltijop.supabase.co/rest/v1/heartbeat?id=eq.1"
          else
            echo "::warning::AUDMWKALKLOOMRLTIJOP_SERVICE_ROLE secret not set!"
          fi

      - name: Heartbeat - Project lbegyddwuysusivvjvxy
        run: |
          KEY=$(echo "${{ secrets.LBEGYDDWUYSUSIVVJVXY_SERVICE_ROLE }}" | tr -d '\r\n ')
          if [ -n "$KEY" ]; then
            curl -f -i \
              --retry 5 \
              --retry-delay 5 \
              --retry-connrefused \
              --connect-timeout 10 \
              -X PATCH \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d "{\"last_ping\": \"${{ steps.time.outputs.timestamp }}\"}" \
              "https://lbegyddwuysusivvjvxy.supabase.co/rest/v1/heartbeat?id=eq.1"
          else
